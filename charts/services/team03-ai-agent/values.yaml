template:
  nameOverride: "team03-ai-agent"
  fullnameOverride: "team03-ai-agent"
  strategy:
    type: Recreate
  image:
    repository: 809691348554.dkr.ecr.ap-northeast-2.amazonaws.com/team03-ai-agent-development-repo
    pullPolicy: Always
    tag: "sha-94798d3"

  # 서비스별 환경 변수
  env:
    SERVICE_NAME: "team03-ai-agent"
    DJANGO_SETTINGS_MODULE: "config.settings"
    DJANGO_DEBUG: "False"
    DJANGO_ALLOWED_HOSTS: "*"

  # Secret에서 환경 변수 참조
  extraEnv:
    - name: DJANGO_SECRET
      valueFrom:
        secretKeyRef:
          name: team03-ai-agent-secrets
          key: django-secret
    - name: OPENAI_API
      valueFrom:
        secretKeyRef:
          name: team03-ai-agent-secrets
          key: openai-api-key

  # 포트 설정 (8080으로 통일)
  containerPort: 8080
  servicePort: 80

  # livenessProbe와 readinessProbe 설정
  livenessProbe:
    httpGet:
      path: /actuator/health/
      port: 8080
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 5
    successThreshold: 1
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /actuator/health/
      port: 8080
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    successThreshold: 1
    failureThreshold: 3

  # 리소스 제한
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
