# team03-be values for template subchart
template:
  nameOverride: "team03-be"
  fullnameOverride: "team03-be"
  
  strategy:
    type: Recreate
  
  image:
    repository: 809691348554.dkr.ecr.ap-northeast-2.amazonaws.com/team03-be-development-repo
    pullPolicy: Always
    tag: "sha-c6d3167"
  
  # 명시적으로 Vault 설정 활성화
  vault:
    enabled: true
    environment: "dev"

  prometheus:
    enabled: true
    scrape: "true"
    path: "/actuator/prometheus"
    port: "8080"
  
  serviceAccountName: "team03-be"
  
  env: {}
