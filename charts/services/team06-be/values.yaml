# team06-be values
template:
  nameOverride: "team06-be"
  fullnameOverride: "team06-be"

  strategy:
    type: Recreate

  readinessProbe:
    httpGet:
      path: /actuator/health
      port: 8080
    initialDelaySeconds: 50
    periodSeconds: 40
    timeoutSeconds: 40      # 충분한 여유시간
    failureThreshold: 3

  livenessProbe:
    httpGet:
      path: /actuator/health
      port: 8080
    initialDelaySeconds: 60
    periodSeconds: 40      # 더 긴 간격으로 체크
    timeoutSeconds: 40      # 충분한 여유시간
    failureThreshold: 3

  image:
    repository: 809691348554.dkr.ecr.ap-northeast-2.amazonaws.com/team06-be-development-repo
    pullPolicy: Always
    tag: "sha-92d6075"

  vault:
    enabled: true
    environment: "dev"

  prometheus:
    enabled: true
    scrape: "true"
    path: "/actuator/prometheus"
    port: "8080"

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 200m
      memory: 256Mi

  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70


  serviceAccountName: "team06-be"

  env: {}
