# team06-be values
template:
  nameOverride: "team06-be"
  fullnameOverride: "team06-be"

  strategy:
    type: Recreate

  image:
    repository: 809691348554.dkr.ecr.ap-northeast-2.amazonaws.com/team06-be-development-repo
    pullPolicy: Always
    tag: "sha-92d6075"

  vault:
    enabled: true
    environment: "dev"

  prometheus:
    enabled: true
    scrape: "true"
    path: "/actuator/prometheus"
    port: "8080"

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 200m
      memory: 256Mi

  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70


  serviceAccountName: "team06-be"

  env: {}


# 프로브 설정 (최상위 레벨로 이동)
readinessProbe:
  enabled: false

livenessProbe:
  enabled: false
