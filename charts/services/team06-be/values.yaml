# team06-be values
template:
  nameOverride: "team06-be"
  fullnameOverride: "team06-be"

  strategy:
    type: Recreate

  # 프로브 설정 추가
  readinessProbe:
    httpGet:
      path: /actuator/health/readiness
      port: 8080
    initialDelaySeconds: 50    # 애플리케이션 시작 시간보다 길게
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  livenessProbe:
    httpGet:
      path: /actuator/health/liveness
      port: 8080
    initialDelaySeconds: 60    # readiness보다 더 길게
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3

  image:
    repository: 809691348554.dkr.ecr.ap-northeast-2.amazonaws.com/team06-be-development-repo
    pullPolicy: Always
    tag: "sha-92d6075"

  vault:
    enabled: true
    environment: "dev"

  prometheus:
    enabled: true
    scrape: "true"
    path: "/actuator/prometheus"
    port: "8080"

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 200m
      memory: 256Mi

  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70


  serviceAccountName: "team06-be"

  env: {}
